# Runs ONLY the Django application (Gunicorn). PostgreSQL lives on Render and
# media on S3 — neither is managed here. Nginx will be added/run separately.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-landing-web:latest
    container_name: project_landing_web
    restart: unless-stopped
    # PID 1 init reaps zombies and forwards signals; combined with a 30s grace
    # period this lets Gunicorn shut down its workers cleanly on `docker stop`.
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
